      </defs><rect x="125.0" y="30" width="150" height="62" rx="31" ry="31" class="flow-shape"/><text x="200" y="65" class="flow-text">Начало minus</text><path d="M 200 92 L 200 146" class="flow-edge-line" marker-end="url(#arrowHead)"/><rect x="10" y="146" width="380" height="54" class="flow-shape"/><line x1="26" y1="146" x2="26" y2="200" class="flow-shape"/><line x1="374" y1="146" x2="374" y2="200" class="flow-shape"/><text x="200" y="177" class="flow-text">Complex minus(Complex a, Complex b)</text><text x="158" y="233" font-size="30" class="flow-brace-svg-text">{</text><path d="M 200 200 L 200 254" class="flow-edge-line" marker-end="url(#arrowHead)"/><rect x="100.0" y="254" width="200" height="54" class="flow-shape"/><text x="200" y="285" class="flow-text">Complex result;</text><path d="M 200 308 L 200 362" class="flow-edge-line" marker-end="url(#arrowHead)"/><rect x="20.0" y="362" width="360" height="54" class="flow-shape"/><text x="200" y="393" class="flow-text">result.real = a.real - b.real;</text><path d="M 200 416 L 200 470" class="flow-edge-line" marker-end="url(#arrowHead)"/><rect x="20.0" y="470" width="360" height="54" class="flow-shape"/><text x="200" y="501" class="flow-text">result.imag = a.imag - b.imag;</text><path d="M 200 524 L 200 578" class="flow-edge-line" marker-end="url(#arrowHead)"/><rect x="105.0" y="578" width="190" height="62" rx="31" ry="31" class="flow-shape"/><text x="200" y="613" class="flow-text">return result;</text><text x="320" y="655" font-size="30" class="flow-brace-svg-text">}</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>