  <text x="439.8" y="144.9" text-anchor="start" font-family="Courier New, Liberation Mono, monospace" font-size="14" fill="#333333" xml:space="preserve">//Задача 2. Дан одномерный массив целых чисел, проверить, упорядочен ли он по возрастанию.</text>
  <text x="439.8" y="164.9" text-anchor="start" font-family="Courier New, Liberation Mono, monospace" font-size="14" fill="#333333" xml:space="preserve">//Решить с флажком F типа bool, начальное значение false, лучше циклом while.</text>
  <text x="439.8" y="184.9" text-anchor="start" font-family="Courier New, Liberation Mono, monospace" font-size="14" fill="#333333" xml:space="preserve">//Цикл завершается, когда перебраны все элементы или найдено нарушение, то есть соседние элементы со знаком &gt;= (тогда F = true и проверка прекращается).</text>
  <text x="439.8" y="204.9" text-anchor="start" font-family="Courier New, Liberation Mono, monospace" font-size="14" fill="#333333" xml:space="preserve">//Если ни одно сравнение не нарушило знак «меньше», вывести сообщение, что массив упорядочен.</text>
